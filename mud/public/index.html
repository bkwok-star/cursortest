<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0a0a;
      color: #00ff00;
      font-family: 'VT323', 'Courier New', Courier, monospace;
      font-size: 18px;
      line-height: 1.4;
    }

    .terminal {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      padding: 0.5rem 1rem;
    }

    .output {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 0;
    }

    .output::-webkit-scrollbar {
      width: 8px;
    }
    .output::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    .output::-webkit-scrollbar-thumb {
      background: #003300;
      border-radius: 4px;
    }
    .output::-webkit-scrollbar-thumb:hover {
      background: #004400;
    }

    .prompt-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0;
      border-top: 1px solid #003300;
      margin-top: 0.25rem;
    }

    .prompt-line .cursor {
      color: #00ff00;
    }

    .prompt-line input {
      flex: 1;
      background: transparent;
      border: none;
      color: #00ff00;
      font-family: inherit;
      font-size: inherit;
      outline: none;
    }

    .prompt-line input::placeholder {
      color: #004400;
    }

    .status {
      font-size: 0.85em;
      color: #004400;
      margin-right: 0.5rem;
    }
    .status.connected {
      color: #00aa00;
    }
    .status.connected::before {
      content: '● ';
    }

    .hp-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.35rem 0;
      border-bottom: 1px solid #003300;
      margin-bottom: 0.25rem;
      font-size: 0.9em;
    }
    .hp-bar .hp-label {
      color: #00aa00;
      min-width: 6ch;
    }
    .hp-bar .hp-fill-wrap {
      flex: 1;
      max-width: 200px;
      height: 14px;
      background: #0d0d0d;
      border: 1px solid #003300;
      border-radius: 4px;
      overflow: hidden;
    }
    .hp-bar .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #00aa00 0%, #00ff00 100%);
      border-radius: 3px;
      transition: width 0.2s ease;
    }
    .hp-bar .hp-fill.low {
      background: linear-gradient(90deg, #666600 0%, #aaaa00 100%);
    }
    .hp-bar .hp-fill.critical {
      background: linear-gradient(90deg, #660000 0%, #ff0000 100%);
    }

    .stamina-bar, .energy-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.2rem 0;
      font-size: 0.85em;
    }
    .stamina-bar .bar-fill-wrap, .energy-bar .bar-fill-wrap {
      flex: 1;
      max-width: 180px;
      height: 10px;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 3px;
      overflow: hidden;
    }
    .stamina-bar .bar-fill { background: linear-gradient(90deg, #666600 0%, #dddd00 100%); height: 100%; border-radius: 2px; transition: width 0.2s ease; }
    .energy-bar .bar-fill { background: linear-gradient(90deg, #004466 0%, #00aaff 100%); height: 100%; border-radius: 2px; transition: width 0.2s ease; }
    .stamina-bar .bar-label { color: #888800; min-width: 5ch; }
    .energy-bar .bar-label { color: #0088aa; min-width: 5ch; }

    .line.combat-deal {
      color: #dddd00;
      font-weight: bold;
    }
    .line.combat-take {
      color: #ff4444;
      font-weight: bold;
    }

    .app-wrap {
      display: flex;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      gap: 0;
    }

    .character-sheet {
      flex-shrink: 0;
      width: 220px;
      padding: 1rem;
      border-left: 1px solid #003300;
      background: #080808;
      font-size: 0.95em;
    }
    .character-sheet h2 {
      margin: 0 0 0.75rem 0;
      color: #00aa00;
      font-size: 1.1em;
      font-weight: normal;
      border-bottom: 1px solid #003300;
      padding-bottom: 0.35rem;
    }
    .character-sheet .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.25rem;
    }
    .character-sheet .stat-label {
      color: #006600;
    }
    .character-sheet .skills-list {
      margin-bottom: 0.5rem;
      color: #00aa88;
      font-size: 0.9em;
    }
    .character-sheet .equip-list {
      margin-top: 0.75rem;
    }
    .character-sheet .equip-item {
      margin-bottom: 0.35rem;
      color: #00cc00;
    }
    .character-sheet .equip-item.empty {
      color: #003300;
      font-style: italic;
    }
    .character-sheet .inv-list {
      margin-top: 0.5rem;
      max-height: 120px;
      overflow-y: auto;
    }
    .character-sheet .inv-item {
      color: #008800;
      font-size: 0.9em;
    }
    .character-sheet .xp-bar-wrap {
      margin-top: 0.25rem;
      height: 8px;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 3px;
      overflow: hidden;
    }
    .character-sheet .xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #440066 0%, #aa44ff 100%);
      border-radius: 2px;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="app-wrap">
  <div class="terminal">
    <div class="hp-bar" id="hpBar">
      <span class="hp-label">HP:</span>
      <div class="hp-fill-wrap"><div class="hp-fill" id="hpFill" style="width: 100%"></div></div>
      <span class="hp-text" id="hpText">100/100</span>
    </div>
    <div class="stamina-bar" id="staminaBar">
      <span class="bar-label">STM:</span>
      <div class="bar-fill-wrap"><div class="bar-fill" id="staminaFill" style="width: 100%"></div></div>
      <span class="bar-text" id="staminaText">100/100</span>
    </div>
    <div class="energy-bar" id="energyBar">
      <span class="bar-label">NRG:</span>
      <div class="bar-fill-wrap"><div class="bar-fill" id="energyFill" style="width: 100%"></div></div>
      <span class="bar-text" id="energyText">50/50</span>
    </div>
    <div class="output" id="output">Connecting...</div>
    <div class="prompt-line">
      <span class="status" id="status"></span>
      <span class="cursor">&gt;</span>
      <input type="text" id="input" placeholder=" type here..." autocomplete="off" disabled>
    </div>
  </div>
  <aside class="character-sheet" id="characterSheet">
    <h2>Character</h2>
    <div class="stat-row"><span class="stat-label">HP</span><span id="csHp">100/100</span></div>
    <div class="stat-row"><span class="stat-label">Attack</span><span id="csAttack">10</span></div>
    <div class="stat-row"><span class="stat-label">Gold</span><span id="csGold">0</span></div>
    <div class="stat-row"><span class="stat-label">Class</span><span id="csClass">Warrior</span></div>
    <div class="stat-row"><span class="stat-label">Level</span><span id="csLevel">1</span></div>
    <div class="stat-row"><span class="stat-label">XP</span><span id="csXp">0 / 100</span></div>
    <div class="xp-bar-wrap"><div class="xp-bar-fill" id="csXpFill" style="width: 0%"></div></div>
    <h2 style="margin-top: 0.75rem;">Skills</h2>
    <div class="skills-list" id="csSkills">—</div>
    <div class="equip-list">
      <div class="equip-item" data-slot="WEAPON">Weapon: <span class="eq-value">—</span></div>
      <div class="equip-item" data-slot="SHIELD">Shield: <span class="eq-value">—</span></div>
      <div class="equip-item" data-slot="HEAD">Head: <span class="eq-value">—</span></div>
      <div class="equip-item" data-slot="BODY">Body: <span class="eq-value">—</span></div>
    </div>
    <h2 style="margin-top: 1rem;">Inventory</h2>
    <div class="inv-list" id="csInv">Nothing.</div>
  </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
